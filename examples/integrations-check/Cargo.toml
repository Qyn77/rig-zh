[package]
name = "rig-optional-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rig = { version = "=0.46.0", features = ["rmcp", "mongodb", "neo4j", "qdrant"] }
rmcp = { version = "=3.5.0", features = ["client", "server", "macros", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
mongodb = "=3.4.1"
qdrant-client = "1.10"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[profile.dev]
debug = 0
