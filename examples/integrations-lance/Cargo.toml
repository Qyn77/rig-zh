[package]
name = "rig-lance-check"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rig = { version = "=0.46.0", features = ["lancedb"] }
lancedb = { version = "=0.30.0", features = ["aws", "dynamodb"] }
arrow-array = "=58.4.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# aws-smithy-json 0.63 is incompatible with Document in types 1.7.
aws-smithy-types = "=1.6.3"
[profile.dev]
debug = 0
