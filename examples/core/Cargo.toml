[package]
name = "rig-docs-046"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
autoexamples = false

[dependencies]
rig = { version = "=0.46.0", features = ["test-utils", "memory", "cassette", "image", "audio", "pdf", "epub", "rmcp", "websocket"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmcp = { version = "3.5", features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-io", "macros"] }
thiserror = "2"

[profile.dev]
debug = 0

