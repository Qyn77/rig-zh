[package]
name = "rig-surreal-check"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rig = { version = "=0.46.0", features = ["surrealdb"] }
surrealdb = "=3.2.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
[profile.dev]
debug = 0
