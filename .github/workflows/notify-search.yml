name: Notify search engines after publication

on:
  workflow_call:
    secrets:
      INDEXNOW_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-submission
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published ownership proof and notify IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/submit_indexnow.py
